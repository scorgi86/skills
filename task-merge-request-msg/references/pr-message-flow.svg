<svg xmlns="http://www.w3.org/2000/svg" width="920" height="900" viewBox="0 0 920 900" role="img" aria-labelledby="title desc">
  <title id="title">Схема работы Task Merge Request Message</title>
  <desc id="desc">Выбор режима, Git scope, evidence-пакет, авторский draft, независимый reader-review и сохранение</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
    <style>
      .box { fill: #f6f8fa; stroke: #52606d; stroke-width: 2; }
      .artifact { fill: #e8f1fb; stroke: #3776ab; stroke-width: 2; }
      .decision { fill: #fff4d6; stroke: #9a6700; stroke-width: 2; }
      .success { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; }
      .line { fill: none; stroke: #52606d; stroke-width: 2; marker-end: url(#arrow); }
      .label { font-family: Arial, sans-serif; font-size: 19px; fill: #1f2933; text-anchor: middle; }
      .small { font-family: Arial, sans-serif; font-size: 15px; fill: #52606d; text-anchor: middle; }
      .edge { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #52606d; }
    </style>
  </defs>

  <rect class="box" x="290" y="20" width="340" height="62" rx="8"/>
  <text class="label" x="460" y="48">Выбор режима</text>
  <text class="small" x="460" y="70">Fast / Semantic / Deep</text>

  <rect class="artifact" x="290" y="116" width="340" height="76" rx="8"/>
  <text class="label" x="460" y="147">Git scope</text>
  <text class="small" x="460" y="174">scope.json + selected.diff</text>

  <rect class="artifact" x="290" y="226" width="340" height="76" rx="8"/>
  <text class="label" x="460" y="257">Подготовка evidence</text>
  <text class="small" x="460" y="284">analysis-input.json + prompt.txt</text>

  <polygon class="decision" points="460,338 610,400 460,462 310,400"/>
  <text class="label" x="460" y="394">Авторский результат</text>
  <text class="label" x="460" y="418">в кеше?</text>

  <rect class="artifact" x="50" y="492" width="330" height="82" rx="8"/>
  <text class="label" x="215" y="523">Факты и цельный draft</text>
  <text class="small" x="215" y="550">один авторский проход</text>

  <rect class="success" x="540" y="492" width="330" height="82" rx="8"/>
  <text class="label" x="705" y="523">Cache hit</text>
  <text class="small" x="705" y="550">0 модельных вызовов</text>

  <rect class="artifact" x="290" y="618" width="340" height="76" rx="8"/>
  <text class="label" x="460" y="649">Проверка evidence</text>
  <text class="small" x="460" y="676">path + symbol + line + quote</text>

  <rect class="artifact" x="290" y="728" width="340" height="76" rx="8"/>
  <text class="label" x="460" y="759">Независимый reader-review</text>
  <text class="small" x="460" y="786">6 ответов + revision + lint</text>

  <rect class="success" x="290" y="838" width="340" height="44" rx="8"/>
  <text class="label" x="460" y="867">Валидация и сохранение</text>

  <path class="line" d="M460 82 L460 116"/>
  <path class="line" d="M460 192 L460 226"/>
  <path class="line" d="M460 302 L460 338"/>
  <path class="line" d="M310 400 L215 400 L215 492"/>
  <text class="edge" x="240" y="388">Нет</text>
  <path class="line" d="M610 400 L705 400 L705 492"/>
  <text class="edge" x="665" y="388">Да</text>
  <path class="line" d="M215 574 L215 596 L460 596 L460 618"/>
  <path class="line" d="M705 574 L705 596 L460 596 L460 618"/>
  <path class="line" d="M460 694 L460 728"/>
  <path class="line" d="M460 804 L460 838"/>
</svg>
